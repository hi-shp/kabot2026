<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>KABOAT 2026</title><link rel="stylesheet" href="/outdoor.css"><link rel="stylesheet" href="/theme.css"></head>
<body>
<header id="connectionHeader"><div class="ssh-connect-controls" role="group" aria-label="SSH 연결 선택"><button id="connectHotspot" type="button">핫스팟 SSH 연결</button><button id="connectRocket" type="button">로켓 SSH 연결</button><button id="rocketPowerOn" type="button">로켓 전원 켜기</button><span id="rocketPowerStatus" role="status" aria-live="polite">로켓 전원 확인 중</span><span id="connectionActionStatus" role="status" aria-live="polite" hidden></span></div><strong>ISV 원격 연결</strong><div id="sshEndpoints" class="ssh-endpoints"><span>핫스팟 <code id="hotspotEndpoint">주소 확인 중</code></span><span>로켓 <code id="rocketEndpoint">주소 확인 중</code></span></div><span id="connectionPath" role="status" aria-live="polite">연결 경로 확인 중</span></header>
<section id="sensorOverview"><iframe id="sensorFrame" src="/sensors?sensors_only=1&amp;section=sensors" title="실시간 센서 데이터"></iframe></section><main id="outdoorOverview">
<section class="panel gps-map"><div class="toolbar"><strong>GPS 지도</strong><span id="position">현재 위치 대기</span><button id="follow">배 따라가기</button><button id="clearTrail">누적 경로 초기화</button><select id="basemap" aria-label="배경 지도 종류"><option value="satellite">위성사진 · Esri</option><option value="street">일반 지도 · OSM</option></select><label><input id="tiles" type="checkbox" checked>배경 지도</label></div><div id="layers" class="layer-controls" aria-label="지도 표시 레이어"></div><div class="map-stage"><div class="map-zoom" role="group" aria-label="지도 확대 축소"><button id="zoomIn" aria-label="지도 확대" title="지도 확대">+</button><button id="zoomOut" aria-label="지도 축소" title="지도 축소">−</button></div><canvas id="map" aria-label="GPS 지도, 드래그 이동 및 휠 확대"></canvas><div class="map-legend">청록: 실제 이동 경로 · 화살표: 현재 방향 · 숫자: 목적지</div><div class="map-attribution" id="mapAttribution">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></div></div><div class="toolbar"><label>지점 종류 <select id="waypointType"><option value="path">경로추종</option><option value="point">위치추종</option><option value="hold">위치유지</option><option value="dock">도킹</option></select></label><span id="holdDurationLabel" hidden>도착 후 5초 위치유지 · 자동으로 다음 지점</span><button id="addPoint">지점 추가</button><button id="undoPoint">마지막 지점 취소</button><button id="clearPoints">지점 비우기</button><button id="savePoints">경로 저장</button></div><div id="points"></div><div class="toolbar"><label>출력 상한 <input id="percent" type="number" min="1" max="100" value="20"> %</label><strong id="trial">정지</strong></div></section>
<section class="panel slam-map"><span id="slamMapStatus" role="status" hidden></span><div id="slamMapHost" class="slam-map-host" aria-label="실시간 SLAM 지도"><iframe id="slamMapFrame" src="/?slam_embed=1" title="실시간 SLAM 지도"></iframe><div id="slamMapPlaceholder" class="slam-map-placeholder">SLAM 지도를 연결하는 중입니다.</div></div></section>
</main><p id="notice" role="status"></p><script src="/outdoor.js"></script></body></html>
